<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Dari</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FB;--ink:#16294A;--card:#fff;--line:#1F4E8C;--accent:#F2A900;--good:#1E8E5A;--bad:#C8374B;--soft:#DCE8F6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B30;--ink:#EAF1FB;--card:#192A47;--line:#7FB0F0;--soft:#223A60}}
:root[data-theme="dark"]{--bg:#0F1B30;--ink:#EAF1FB;--card:#192A47;--line:#7FB0F0;--soft:#223A60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Vazirmatn",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.stars{font-size:1rem;background:var(--accent);color:#16294A;padding:4px 12px;border-radius:99px;font-weight:700}
.tabs,.cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;color:inherit;cursor:pointer;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;min-height:48px}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"],.tabs button.on{background:var(--line);color:#fff;font-weight:700}
:root[data-theme="dark"] button.on,:root[data-theme="dark"] button[aria-pressed="true"]{color:#0F1B30}
.cats button{padding:6px 14px;min-height:40px;border-width:2px;font-size:.9rem}
.flash{perspective:900px;margin:14px 0}
.card{position:relative;height:300px;width:100%;transform-style:preserve-3d;transition:transform .5s;border:0;padding:0;background:none;border-radius:24px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:4px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.back{transform:rotateY(180deg)}
.emoji{font-size:110px;line-height:1}
.dari{font-size:3.4rem;font-weight:800;line-height:1.3}
.tr{font-size:1.5rem;color:var(--line);font-weight:700}
.en{font-size:1.2rem;opacity:.8}
.hint{font-size:.9rem;opacity:.65}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{opacity:.7}
.prompt{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:18px;text-align:center;margin:14px 0}
.prompt .emoji{font-size:72px}
.prompt .en{font-size:1.3rem;opacity:1;font-weight:700}
.answer{min-height:76px;background:var(--soft);border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-content:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;direction:rtl;justify-content:center;min-height:60px}
.chip{font-size:1.7rem;font-weight:700;padding:6px 18px;background:var(--card)}
.msg{min-height:3.2em;text-align:center;font-weight:700}
.msg.ok{color:var(--good)}.msg.no{color:var(--bad)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.primary{background:var(--accent);color:#16294A;border-color:#16294A;font-weight:800}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1><span>Learn Dari</span><span class="stars" id="stars">⭐ 0</span></h1>
<div class="tabs" role="tablist">
  <button class="on" id="tF" onclick="show('F')">Flashcards</button>
  <button id="tS" onclick="show('S')">Build sentences</button>
</div>

<section id="F">
  <div class="cats" id="cats"></div>
  <div class="flash"><button class="card" id="card" onclick="this.classList.toggle('flip')" aria-label="Flip card">
    <div class="face front"><div class="emoji" id="fe"></div><div class="hint">Tap to see the word</div></div>
    <div class="face back"><div class="dari" id="fd" dir="rtl" lang="fa-AF"></div><div class="tr" id="ft"></div><div class="en" id="fn"></div></div>
  </button></div>
  <div class="nav"><button onclick="step(-1)">Back</button><span class="count" id="cnt"></span><button onclick="step(1)">Next</button></div>
</section>

<section id="S" hidden>
  <div class="prompt"><div class="emoji" id="se"></div><div class="en" id="sn"></div><div class="hint">Tap the words in the right order</div></div>
  <div class="answer" id="ans" aria-label="Your sentence"></div>
  <div class="bank" id="bank"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="row">
    <button onclick="reset()">Start again</button>
    <button class="primary" id="nextS" onclick="nextSent()">Next sentence</button>
  </div>
</section>
</main>

<script>
// Edit this data to add words and sentences. Afghan Dari spellings and pronunciation.
const WORDS=[
 {c:"Animals",e:"🐱",d:"پشک",t:"pishak",n:"cat"},
 {c:"Animals",e:"🐶",d:"سگ",t:"sag",n:"dog"},
 {c:"Animals",e:"🐴",d:"اسپ",t:"asp",n:"horse"},
 {c:"Animals",e:"🐄",d:"گاو",t:"gaw",n:"cow"},
 {c:"Animals",e:"🐔",d:"مرغ",t:"murgh",n:"chicken"},
 {c:"Animals",e:"🐟",d:"ماهی",t:"mahi",n:"fish"},
 {c:"Family",e:"👩",d:"مادر",t:"madar",n:"mother"},
 {c:"Family",e:"👨",d:"پدر",t:"pedar",n:"father"},
 {c:"Family",e:"👦",d:"برادر",t:"baradar",n:"brother"},
 {c:"Family",e:"👧",d:"خواهر",t:"khwahar",n:"sister"},
 {c:"Food",e:"🍞",d:"نان",t:"nan",n:"bread"},
 {c:"Food",e:"🍎",d:"سیب",t:"sib",n:"apple"},
 {c:"Food",e:"💧",d:"آب",t:"aab",n:"water"},
 {c:"Food",e:"🥛",d:"شیر",t:"shir",n:"milk"},
 {c:"Food",e:"🍇",d:"انگور",t:"angur",n:"grapes"},
 {c:"School",e:"📖",d:"کتاب",t:"kitab",n:"book"},
 {c:"School",e:"✏️",d:"قلم",t:"qalam",n:"pen / pencil"},
 {c:"School",e:"🏫",d:"مکتب",t:"maktab",n:"school"},
 {c:"School",e:"🧑‍🏫",d:"معلم",t:"mu'allim",n:"teacher"},
 {c:"Colors",e:"🔴",d:"سرخ",t:"surkh",n:"red"},
 {c:"Colors",e:"🔵",d:"آبی",t:"aabi",n:"blue"},
 {c:"Colors",e:"🟢",d:"سبز",t:"sabz",n:"green"},
 {c:"Colors",e:"🟡",d:"زرد",t:"zard",n:"yellow"}
];
// Words are in correct Dari order (right to left).
const SENTS=[
 {e:"🍞",n:"I eat bread.",w:["من","نان","می‌خورم"],t:"man nan mekhoram"},
 {e:"📖",n:"I read a book.",w:["من","کتاب","می‌خوانم"],t:"man kitab mekhanam"},
 {e:"🐱",n:"The cat drinks milk.",w:["پشک","شیر","می‌خورد"],t:"pishak shir mekhorad"},
 {e:"🐶",n:"The dog is big.",w:["سگ","بزرگ","است"],t:"sag buzurg ast"},
 {e:"🧑‍🏫",n:"My mother is a teacher.",w:["مادر","من","معلم","است"],t:"madar-e man mu'allim ast"}
];
const $=id=>document.getElementById(id);
let cat="All",deck=WORDS,i=0,si=0,stars=0,placed=[],done=false;

function show(x){$("F").hidden=x!=="F";$("S").hidden=x!=="S";$("tF").classList.toggle("on",x==="F");$("tS").classList.toggle("on",x==="S");if(x==="S")loadSent();}
function cats(){const names=["All",...new Set(WORDS.map(w=>w.c))];$("cats").innerHTML="";
 names.forEach(n=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",n===cat);
  b.onclick=()=>{cat=n;deck=n==="All"?WORDS:WORDS.filter(w=>w.c===n);i=0;cats();card();};$("cats").appendChild(b);});}
function card(){const w=deck[i],c=$("card");$("fe").textContent=w.e;$("cnt").textContent=(i+1)+" / "+deck.length;
 const setBack=()=>{$("fd").textContent=w.d;$("ft").textContent=w.t;$("fn").textContent=w.n;};
 clearTimeout(window.bt);
 if(c.classList.contains("flip")){c.classList.remove("flip");window.bt=setTimeout(setBack,520);}else setBack();}
function step(d){i=(i+d+deck.length)%deck.length;card();}

function shuffle(orig){let a;do{a=orig.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}}while(a.length>1&&a.every((v,k)=>v===orig[k]));return a;}
function loadSent(){const s=SENTS[si];$("se").textContent=s.e;$("sn").textContent=s.n;placed=[];done=false;
 window.bankList=shuffle(s.w).map((w,k)=>({w,k}));$("msg").textContent="";$("msg").className="msg";draw();}
function reset(){const s=SENTS[si];placed=[];done=false;$("msg").textContent="";$("msg").className="msg";draw();}
function draw(){const mk=(o,fn)=>{const b=document.createElement("button");b.className="chip";b.textContent=o.w;b.lang="fa-AF";b.onclick=fn;return b;};
 $("ans").innerHTML="";$("bank").innerHTML="";
 placed.forEach(o=>$("ans").appendChild(mk(o,()=>{if(done)return;placed=placed.filter(p=>p!==o);draw();})));
 window.bankList.filter(o=>!placed.includes(o)).forEach(o=>$("bank").appendChild(mk(o,()=>{if(done)return;placed.push(o);draw();check();})));}
function check(){const s=SENTS[si];if(placed.length<s.w.length)return;
 const ok=placed.every((o,k)=>o.w===s.w[k]);const m=$("msg");
 if(ok){done=true;stars++;$("stars").textContent="⭐ "+stars;m.className="msg ok";m.textContent="Great job! "+s.t;}
 else{m.className="msg no";m.textContent="Not quite. Tap a word to take it back, or press Start again.";}}
function nextSent(){si=(si+1)%SENTS.length;loadSent();}

cats();card();
</script>
</body>
</html>
